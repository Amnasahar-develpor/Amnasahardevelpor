services:
  - type: web
    name: amna-sahar-portfolio
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /app/data
    disk:
      name: portfolio-data
      mountPath: /app/data
      sizeGB: 1
